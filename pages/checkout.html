<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Event Ticketing System</title>
    <link rel="stylesheet" href="./../css/checkout.css">
</head>
<body>
    <div class="container">
        <!-- Step Indicator -->
        <div class="step-indicator">
            <div class="step active">
                <div class="step-number">1</div>
                <span>Checkout</span>
            </div>
            <div class="step-line active"></div>
            <div class="step">
                <div class="step-number">2</div>
                <span>Confirmation</span>
            </div>
        </div>

        <div class="checkout-wrapper">
            <!-- Left Column - Main Form -->
            <div class="checkout-main">
                
                <!-- Order Summary -->
                <div class="card order-summary">
                    <h3>Order Summary</h3>
                    <div class="summary-items" id="summaryItems">
                        <!-- Dynamically populated from ticket table -->
                    </div>
                    <div class="summary-divider"></div>
                    <div class="summary-totals">
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span id="subtotal">$0.00</span>
                        </div>
                        <div class="summary-row">
                            <span>Tax</span>
                            <span id="tax">$0.00</span>
                        </div>
                        <div class="summary-row">
                            <span>Processing Fee</span>
                            <span id="processingFee">$0.00</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total</span>
                            <span id="totalAmount">$0.00</span>
                        </div>
                    </div>
                </div>

                <!-- Attendee Information Form -->
                <form id="checkoutForm" method="POST" action="./../php/process_checkout.php">
                    
                    <div class="card">
                        <h3>Attendee Information</h3>
                        <div class="form-group">
                            <label for="fullName">Full Name *</label>
                            <input type="text" id="fullName" name="fullName" required placeholder="John Doe">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="email">Email *</label>
                                <input type="email" id="email" name="email" required placeholder="john@example.com">
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone</label>
                                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000">
                            </div>
                        </div>
                    </div>

                    <!-- Billing Address -->
                    <div class="card">
                        <h3>Billing Address</h3>
                        <div class="form-group">
                            <label for="address">Street Address *</label>
                            <input type="text" id="address" name="address" required placeholder="123 Main Street">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="city">City *</label>
                                <input type="text" id="city" name="city" required placeholder="New York">
                            </div>
                            <div class="form-group">
                                <label for="zip">ZIP Code *</label>
                                <input type="text" id="zip" name="zip" required placeholder="10001">
                            </div>
                        </div>
                    </div>

                    <!-- Payment Information -->
                    <div class="card">
                        <h3>💳 Payment Method</h3>
                        <div class="payment-methods">
                            <button type="button" class="payment-btn active">Credit Card</button>
                            <button type="button" class="payment-btn">Digital Wallet</button>
                        </div>

                        <div class="form-group">
                            <label for="cardName">Cardholder Name *</label>
                            <input type="text" id="cardName" name="cardName" required placeholder="John Doe">
                        </div>
                        <div class="form-group">
                            <label for="cardNumber">Card Number *</label>
                            <input type="text" id="cardNumber" name="cardNumber" required placeholder="1234 5678 9012 3456" maxlength="19">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="expiry">Expiry Date *</label>
                                <input type="text" id="expiry" name="expiry" required placeholder="MM/YY" maxlength="5">
                            </div>
                            <div class="form-group">
                                <label for="cvv">CVV *</label>
                                <input type="text" id="cvv" name="cvv" required placeholder="123" maxlength="3">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary btn-large" id="submitBtn">Complete Purchase - $0.00</button>
                </form>

            </div>

            <!-- Right Column - Sidebar -->
            <div class="checkout-sidebar">
                <div class="card">
                    <div class="event-image">📅</div>
                    <h3>Tech Summit 2025</h3>
                    <p class="venue">📍 Convention Center</p>
                    <p class="date">🗓️ March 15, 2025</p>
                    <div class="security-badge">
                        ✓ Secure payment powered by trusted gateway
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./../js/checkout.js"></script>
    <script>
        // Fetch tickets from database on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Get event_id from URL parameter or use a default
            const urlParams = new URLSearchParams(window.location.search);
            const eventId = urlParams.get('event_id') || 1; // Default to 1 if not in URL
            
            fetch(`./../php/get_tickets.php?event_id=${eventId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        console.error('Error:', data.error);
                        return;
                    }
                    populateOrderSummary(data.tickets);
                    updateTotals(data.tickets);
                })
                .catch(error => console.error('Error loading tickets:', error));
        });

        function populateOrderSummary(tickets) {
            const summaryItems = document.getElementById('summaryItems');
            summaryItems.innerHTML = '';

            tickets.forEach(ticket => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'summary-item';
                itemDiv.innerHTML = `
                    <span>${ticket.quantity}x ${ticket.type} - $${parseFloat(ticket.price).toFixed(2)}</span>
                    <span>$${(ticket.quantity * ticket.price).toFixed(2)}</span>
                `;
                summaryItems.appendChild(itemDiv);
            });
        }

        function updateTotals(tickets) {
            const TAX_RATE = 0.10; // 10% tax
            const PROCESSING_FEE = 10.00;

            let subtotal = 0;
            tickets.forEach(ticket => {
                subtotal += ticket.quantity * ticket.price;
            });

            const tax = subtotal * TAX_RATE;
            const total = subtotal + tax + PROCESSING_FEE;

            document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('tax').textContent = `$${tax.toFixed(2)}`;
            document.getElementById('processingFee').textContent = `$${PROCESSING_FEE.toFixed(2)}`;
            document.getElementById('totalAmount').textContent = `$${total.toFixed(2)}`;
            document.getElementById('submitBtn').textContent = `Complete Purchase - $${total.toFixed(2)}`;
        }
    </script>
</body>
</html>
